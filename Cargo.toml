[package]
name = "shu"
version = "0.1.8"
edition = "2024"
rust-version = "1.88"
description = "A tiny, declarative, agent-friendly repository library"
license = "MIT"
repository = "https://github.com/wiedymi/shu"
homepage = "https://github.com/wiedymi/shu"
readme = "README.md"
keywords = ["git", "repositories", "catalog", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "1.1"
ureq = { version = "3.3", default-features = false, features = ["platform-verifier", "rustls"] }
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.15"

# Shu is distributed as a small standalone utility. This profile keeps its
# release artifacts compact while retaining the safety and debuggability of
# normal development builds.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
