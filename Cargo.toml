[package]
name = "shu"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny, declarative, agent-friendly repository library"
license = "MIT"
repository = "https://github.com/wiedymi/shu"
keywords = ["git", "repositories", "catalog", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.15"
