name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --release
      - name: Test PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install.ps1 -InstallerPath scripts/install.ps1 -BinaryPath target/release/shu.exe

  docker:
    name: Docker end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag shu:test .
      - name: Run Docker end-to-end test
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "$GITHUB_WORKSPACE/tests/docker:/tests:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            shu:test -c 'sh /tests/e2e.sh'

  release-size:
    name: Release size (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build tools
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install Cross for ARM Linux
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
              export CC_x86_64_unknown_linux_musl=musl-gcc
            fi
            cargo build --locked --release --target "${{ matrix.target }}"
          fi
      - name: Record binary size
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/shu"
          if [ "${{ runner.os }}" = "Windows" ]; then binary="${binary}.exe"; fi
          bytes="$(wc -c < "$binary")"
          printf 'Release binary: %s bytes\n' "$bytes"
          printf '## Shu release size\n\n`%s`: **%s bytes**\n' \
            "${{ matrix.target }}" "$bytes" >> "$GITHUB_STEP_SUMMARY"
