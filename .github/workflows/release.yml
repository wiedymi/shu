name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build tools
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Install Cross for ARM Linux
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
              export CC_x86_64_unknown_linux_musl=musl-gcc
            fi
            cargo build --locked --release --target "${{ matrix.target }}"
          fi
      - name: Package archive
        shell: bash
        run: |
          mkdir -p dist
          binary="target/${{ matrix.target }}/release/shu"
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="${binary}.exe"
            7z a "dist/shu-${{ matrix.target }}.zip" "$binary"
            cp "$binary" "dist/shu-${{ matrix.target }}.exe"
          else
            tar -C "$(dirname "$binary")" -cJf "dist/shu-${{ matrix.target }}.tar.xz" "$(basename "$binary")"
            cp "$binary" "dist/shu-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Add installers and checksums
        run: |
          cp scripts/install.sh release/shu-installer.sh
          cp scripts/install.ps1 release/shu-installer.ps1
          cd release
          sha256sum shu-* > SHA256SUMS
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="$(mktemp)"
          printf '## Changelog\n\nSee [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md) for curated release notes.\n\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" > "$notes_file"
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release/* "${prerelease[@]}" --notes-file "$notes_file" \
            --title "Shu ${GITHUB_REF_NAME#v}" \
            --generate-notes
